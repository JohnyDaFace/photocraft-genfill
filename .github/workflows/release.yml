# Tests on every push; on a version tag (v1.0.0 …) builds the apps and attaches them to a GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: GenFill-for-PhotoCraft-Windows.zip
          - os: macos-latest        # Apple Silicon (M1 and newer)
            asset: GenFill-for-PhotoCraft-macOS-AppleSilicon.zip
          - os: macos-15-intel      # Intel Macs
            asset: GenFill-for-PhotoCraft-macOS-Intel.zip
          - os: ubuntu-latest
            asset: GenFill-for-PhotoCraft-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Build app
        run: python build.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive dist/GenFill-for-PhotoCraft.exe ${{ matrix.asset }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/GenFill for PhotoCraft.app" ${{ matrix.asset }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset }} -C dist genfill-for-photocraft
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
